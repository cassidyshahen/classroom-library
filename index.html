<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

/* LOGIN */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 40px;
  border-radius: 18px;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.login-card h1 {
  margin-top: 0;
  text-align: center;
}

.login-card p {
  text-align: center;
  color: #6b7280;
  margin-bottom: 30px;
}

input, select, button {
  font: inherit;
}

.login-card input {
  width: 100%;
  padding: 13px;
  margin-bottom: 15px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}

.login-button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.login-button:hover {
  background: #1d4ed8;
}

#errorMessage {
  color: #dc2626;
  margin-top: 15px;
  text-align: center;
}

/* APP */
#app {
  display: none;
}

header {
  background: #1e293b;
  color: white;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.logout-button {
  background: #475569;
  color: white;
  border: none;
  padding: 9px 15px;
  border-radius: 7px;
  cursor: pointer;
}

nav {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 10px 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav button {
  border: none;
  background: transparent;
  padding: 10px 15px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

nav button:hover,
nav button.active {
  background: #e8eefc;
  color: #2563eb;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.stat-number {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  margin-bottom: 20px;
}

.card h2 {
  margin-top: 0;
}

.search {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  margin-bottom: 15px;
}

.book-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 15px;
}

.book {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 16px;
  background: #fff;
}

.book h3 {
  margin: 0 0 7px;
  font-size: 17px;
}

.book p {
  margin: 5px 0;
  color: #6b7280;
}

.badge {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #e5e7eb;
  font-size: 12px;
}

.available {
  background: #dcfce7;
  color: #166534;
}

.checked {
  background: #fee2e2;
  color: #991b1b;
}

@media (max-width: 700px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  header {
    padding: 15px;
  }

  main {
    padding: 15px;
  }

  .login-card {
    padding: 25px;
  }
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <h1>📚 Classroom Library</h1>
    <p>Teacher Login</p>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="login-button" onclick="login()">
      Log In
    </button>

    <div id="errorMessage"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">

<header>
  <h1>📚 Classroom Library</h1>
  <button class="logout-button" onclick="logout()">Log Out</button>
</header>

<nav>
  <button class="active" onclick="showPage('dashboard', this)">Dashboard</button>
  <button onclick="showPage('library', this)">Library</button>
  <button onclick="showPage('students', this)">Students</button>
  <button onclick="showPage('checkedout', this)">Checked Out</button>
</nav>

<main>

  <!-- DASHBOARD -->
  <section id="dashboard" class="page active">
    <h2>Dashboard</h2>

    <div class="stats">
      <div class="stat">
        <div>Total Books</div>
        <div class="stat-number" id="totalBooks">—</div>
      </div>

      <div class="stat">
        <div>Students</div>
        <div class="stat-number" id="totalStudents">—</div>
      </div>

      <div class="stat">
        <div>Checked Out</div>
        <div class="stat-number" id="checkedOut">—</div>
      </div>

      <div class="stat">
        <div>Available</div>
        <div class="stat-number" id="available">—</div>
      </div>
    </div>

    <div class="card">
      <h2>Welcome!</h2>
      <p>Your classroom library is connected and ready.</p>
    </div>
  </section>

  <!-- LIBRARY -->
  <section id="library" class="page">
    <h2>Library</h2>

    <div class="card">
      <input
        class="search"
        id="bookSearch"
        placeholder="Search by title, author, or series..."
        oninput="displayBooks()"
      >

      <div id="bookList" class="book-list"></div>
    </div>
  </section>

  <!-- STUDENTS -->
  <section id="students" class="page">
    <h2>Students</h2>

    <div class="card">
      <div id="studentList"></div>
    </div>
  </section>

  <!-- CHECKED OUT -->
  <section id="checkedout" class="page">
    <h2>Checked Out</h2>

    <div class="card">
      <div id="checkoutList"></div>
    </div>
  </section>

</main>
</div>

<script>
const SUPABASE_URL = "https://wwkcacypzjoojonmfaui.supabase.co";

const SUPABASE_KEY =
"sb_publishable_6sl4TXTKcrE7vPG-BcEh3A_GfkmnCkM";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let books = [];
let students = [];
let classes = [];
let checkouts = [];

/* LOGIN */

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const error = document.getElementById("errorMessage");

  error.textContent = "";

  if (!email || !password) {
    error.textContent = "Please enter your email and password.";
    return;
  }

  const { error: loginError } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (loginError) {
    error.textContent = loginError.message;
    return;
  }

  showApp();
}

async function logout() {
  await supabaseClient.auth.signOut();
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("password").value = "";
}

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadData();
}

/* CHECK EXISTING LOGIN */

async function checkLogin() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    showApp();
  }
}

/* LOAD DATABASE */

async function loadData() {

  const booksResult = await supabaseClient
    .from("Books")
    .select("*")
    .order("Title");

  if (booksResult.error) {
    console.error(booksResult.error);
    return;
  }

  books = booksResult.data || [];

  const studentsResult = await supabaseClient
    .from("Students")
    .select("*")
    .order("class_id")
    .order("student_number");

  if (!studentsResult.error) {
    students = studentsResult.data || [];
  }

  const classesResult = await supabaseClient
    .from("Classes")
    .select("*")
    .order("id");

  if (!classesResult.error) {
    classes = classesResult.data || [];
  }

  const checkoutsResult = await supabaseClient
    .from("Checkouts")
    .select("*")
    .is("Return Date", null);

  if (!checkoutsResult.error) {
    checkouts = checkoutsResult.data || [];
  }

  updateDashboard();
  displayBooks();
  displayStudents();
  displayCheckouts();
}

/* DASHBOARD */

function updateDashboard() {
  const totalCopies = books.reduce(
    (sum, book) => sum + Number(book["Copies"] || 1),
    0
  );

  const checkedOutCopies = checkouts.length;

  document.getElementById("totalBooks").textContent = totalCopies;
  document.getElementById("totalStudents").textContent = students.length;
  document.getElementById("checkedOut").textContent = checkedOutCopies;
  document.getElementById("available").textContent =
    Math.max(0, totalCopies - checkedOutCopies);
}

/* LIBRARY */

function displayBooks() {
  const container = document.getElementById("bookList");
  const search =
    document.getElementById("bookSearch").value.toLowerCase();

  const filtered = books.filter(book => {
    const title = String(book["Title"] || "").toLowerCase();
    const author = String(book["Author"] || "").toLowerCase();
    const series = String(book["Series"] || "").toLowerCase();

    return (
      title.includes(search) ||
      author.includes(search) ||
      series.includes(search)
    );
  });

  if (!filtered.length) {
    container.innerHTML = "<p>No books found.</p>";
    return;
  }

  container.innerHTML = filtered.map(book => {

    const copies = Number(book["Copies"] || 1);

    const checkedOutCount = checkouts.filter(
      c => String(c.book_id) === String(book.id)
    ).length;

    const available = Math.max(0, copies - checkedOutCount);

    return `
      <div class="book">
        <h3>${escapeHtml(book["Title"] || "")}</h3>

        <p><strong>Author:</strong>
          ${escapeHtml(book["Author"] || "")}
        </p>

        ${
          book["Series"]
            ? `<p><strong>Series:</strong>
                ${escapeHtml(book["Series"])}
              </p>`
            : ""
        }

        ${
          book["Series #"]
            ? `<p><strong>Book #:</strong> ${book["Series #"]}</p>`
            : ""
        }

        <span class="badge ${available > 0 ? "available" : "checked"}">
          ${available} of ${copies} available
        </span>
      </div>
    `;

  }).join("");
}

/* STUDENTS */

function displayStudents() {
  const container = document.getElementById("studentList");

  if (!students.length) {
    container.innerHTML = "<p>No students found.</p>";
    return;
  }

  container.innerHTML = students.map(student => {

    const className =
      classes.find(c => String(c.id) === String(student.class_id));

    const classText =
      className ? className.name || className.Name || "" : "";

    return `
      <p>
        ${escapeHtml(classText)}
        #${student.student_number}
      </p>
    `;

  }).join("");
}

/* CHECKED OUT */

function displayCheckouts() {
  const container = document.getElementById("checkoutList");

  if (!checkouts.length) {
    container.innerHTML = "<p>Nothing is currently checked out.</p>";
    return;
  }

  container.innerHTML = checkouts.map(checkout => {

    const book = books.find(
      b => String(b.id) === String(checkout.book_id)
    );

    const student = students.find(
      s => String(s.id) === String(checkout.student_id)
    );

    const className = student
      ? classes.find(
          c => String(c.id) === String(student.class_id)
        )
      : null;

    const classText = className
      ? className.name || className.Name || ""
      : "";

    return `
      <div class="book">
        <h3>
          ${escapeHtml(book ? book["Title"] : "Unknown Book")}
        </h3>

        <p>
          <strong>Student:</strong>
          ${escapeHtml(classText)} #${student ? student.student_number : "?"}
        </p>

        <p>
          <strong>Checked out:</strong>
          ${escapeHtml(checkout["Check Out Date"] || "")}
        </p>
      </div>
    `;

  }).join("");
}

/* NAVIGATION */

function showPage(pageId, button) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");

  document.querySelectorAll("nav button").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

/* SECURITY */

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* START */

checkLogin();
</script>

</body>
</html>
