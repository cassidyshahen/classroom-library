<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Library</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

button, input, select {
  font: inherit;
}

/* LOGIN */

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 40px;
  border-radius: 18px;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.login-card h1 {
  margin-top: 0;
  text-align: center;
}

.login-card p {
  text-align: center;
  color: #6b7280;
  margin-bottom: 30px;
}

.login-card input {
  width: 100%;
  padding: 13px;
  margin-bottom: 15px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}

.login-button {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.login-button:hover {
  background: #1d4ed8;
}

#errorMessage {
  color: #dc2626;
  margin-top: 15px;
  text-align: center;
}

/* APP */

#app {
  display: none;
}

header {
  background: #1e293b;
  color: white;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.logout-button {
  background: #475569;
  color: white;
  border: none;
  padding: 9px 15px;
  border-radius: 7px;
  cursor: pointer;
}

nav {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 10px 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav button {
  border: none;
  background: transparent;
  padding: 10px 15px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

nav button:hover,
nav button.active {
  background: #e8eefc;
  color: #2563eb;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

/* DASHBOARD */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.stat-number {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

/* CARDS */

.card {
  background: white;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  margin-bottom: 20px;
}

.card h2 {
  margin-top: 0;
}

/* FORMS */

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

.form-group select,
.form-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: white;
}

.primary-button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.primary-button:hover {
  background: #1d4ed8;
}

.primary-button:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

.return-button {
  padding: 9px 14px;
  border: none;
  border-radius: 7px;
  background: #16a34a;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.return-button:hover {
  background: #15803d;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

/* LIBRARY */

.search {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  margin-bottom: 15px;
}

.book-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 15px;
}

.book {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 16px;
  background: #fff;
}

.book h3 {
  margin: 0 0 7px;
  font-size: 17px;
}

.book p {
  margin: 5px 0;
  color: #6b7280;
}

.badge {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #e5e7eb;
  font-size: 12px;
}

.available {
  background: #dcfce7;
  color: #166534;
}

.checked {
  background: #fee2e2;
  color: #991b1b;
}

/* CHECKOUT LIST */

.checkout-item {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: center;
}

.checkout-info h3 {
  margin: 0 0 7px;
}

.checkout-info p {
  margin: 4px 0;
  color: #6b7280;
}

/* STUDENTS */

.student-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.student-card {
  padding: 14px;
  background: #f8fafc;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

/* RESPONSIVE */

@media (max-width: 700px) {

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .checkout-item {
    flex-direction: column;
    align-items: flex-start;
  }

  header {
    padding: 15px;
  }

  main {
    padding: 15px;
  }

  .login-card {
    padding: 25px;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-card">

    <h1>📚 Classroom Library</h1>

    <p>Teacher Login</p>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-button"
      onclick="login()">

      Log In

    </button>

    <div id="errorMessage"></div>

  </div>

</div>


<!-- APP -->

<div id="app">

<header>

  <h1>📚 Classroom Library</h1>

  <button
    class="logout-button"
    onclick="logout()">

    Log Out

  </button>

</header>


<nav>

  <button
    class="active"
    onclick="showPage('dashboard', this)">

    Dashboard

  </button>

  <button
    onclick="showPage('checkout', this)">

    📕 Check Out

  </button>

  <button
    onclick="showPage('library', this)">

    📚 Library

  </button>

  <button
    onclick="showPage('students', this)">

    👥 Students

  </button>

  <button
    onclick="showPage('checkedout', this)">

    📖 Checked Out

  </button>

</nav>


<main>


<!-- DASHBOARD -->

<section
  id="dashboard"
  class="page active">

  <h2>Dashboard</h2>

  <div class="stats">

    <div class="stat">

      <div>Total Books</div>

      <div
        class="stat-number"
        id="totalBooks">

        —

      </div>

    </div>


    <div class="stat">

      <div>Students</div>

      <div
        class="stat-number"
        id="totalStudents">

        —

      </div>

    </div>


    <div class="stat">

      <div>Checked Out</div>

      <div
        class="stat-number"
        id="checkedOut">

        —

      </div>

    </div>


    <div class="stat">

      <div>Available</div>

      <div
        class="stat-number"
        id="available">

        —

      </div>

    </div>

  </div>


  <div class="card">

    <h2>Welcome!</h2>

    <p>
      Your classroom library is ready to manage.
    </p>

  </div>

</section>


<!-- CHECKOUT -->

<section
  id="checkout"
  class="page">

  <h2>Check Out a Book</h2>

  <div class="card">

    <div class="form-group">

      <label for="classSelect">
        Class
      </label>

      <select
        id="classSelect"
        onchange="loadStudentOptions()">

        <option value="">
          Select a class
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="studentSelect">
        Student
      </label>

      <select id="studentSelect">

        <option value="">
          Select a student
        </option>

      </select>

    </div>


    <div class="form-group">

      <label for="bookSelect">
        Book
      </label>

      <select id="bookSelect">

        <option value="">
          Select a book
        </option>

      </select>

    </div>


    <button
      class="primary-button"
      id="checkoutButton"
      onclick="checkoutBook()">

      Check Out Book

    </button>


    <div
      id="checkoutMessage"
      class="message">

    </div>

  </div>

</section>


<!-- LIBRARY -->

<section
  id="library"
  class="page">

  <h2>Library</h2>

  <div class="card">

    <input
      class="search"
      id="bookSearch"
      placeholder="Search by title, author, or series..."
      oninput="displayBooks()"
    >

    <div
      id="bookList"
      class="book-list">

    </div>

  </div>

</section>


<!-- STUDENTS -->

<section
  id="students"
  class="page">

  <h2>Students</h2>

  <div class="card">

    <div
      id="studentList"
      class="student-grid">

    </div>

  </div>

</section>


<!-- CHECKED OUT -->

<section
  id="checkedout"
  class="page">

  <h2>Currently Checked Out</h2>

  <div class="card">

    <div id="checkoutList">

    </div>

  </div>

</section>


</main>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
  "https://wwkcacypzjoojonmfaui.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_6sl4TXTKcrE7vPG-BcEh3A_GfkmnCkM";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* DATA */

let books = [];
let students = [];
let classes = [];
let checkouts = [];


/* LOGIN */

async function login() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const error =
    document.getElementById(
      "errorMessage"
    );


  error.textContent = "";


  if (!email || !password) {

    error.textContent =
      "Please enter your email and password.";

    return;

  }


  const {
    error: loginError
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


  if (loginError) {

    error.textContent =
      loginError.message;

    return;

  }


  showApp();

}


/* LOGOUT */

async function logout() {

  await supabaseClient
    .auth
    .signOut();


  document.getElementById(
    "app"
  ).style.display = "none";


  document.getElementById(
    "loginScreen"
  ).style.display = "flex";


  document.getElementById(
    "password"
  ).value = "";

}


/* SHOW APP */

function showApp() {

  document.getElementById(
    "loginScreen"
  ).style.display = "none";


  document.getElementById(
    "app"
  ).style.display = "block";


  loadData();

}


/* CHECK EXISTING SESSION */

async function checkLogin() {

  const { data } =
    await supabaseClient
      .auth
      .getSession();


  if (data.session) {

    showApp();

  }

}


/* LOAD DATABASE */

async function loadData() {

  const booksResult =
    await supabaseClient
      .from("Books")
      .select("*")
      .order("Title");


  if (booksResult.error) {

    console.error(
      "Books error:",
      booksResult.error
    );

    return;

  }


  books =
    booksResult.data || [];


  const studentsResult =
    await supabaseClient
      .from("Students")
      .select("*")
      .order("class_id")
      .order("student_number");


  if (studentsResult.error) {

    console.error(
      "Students error:",
      studentsResult.error
    );

  } else {

    students =
      studentsResult.data || [];

  }


  const classesResult =
    await supabaseClient
      .from("Classes")
      .select("*")
      .order("id");


  if (classesResult.error) {

    console.error(
      "Classes error:",
      classesResult.error
    );

  } else {

    classes =
      classesResult.data || [];

  }


  const checkoutsResult =
    await supabaseClient
      .from("Checkouts")
      .select("*")
      .is(
        "Return Date",
        null
      );


  if (checkoutsResult.error) {

    console.error(
      "Checkouts error:",
      checkoutsResult.error
    );

  } else {

    checkouts =
      checkoutsResult.data || [];

  }


  updateDashboard();

  populateClassSelect();

  populateBookSelect();

  displayBooks();

  displayStudents();

  displayCheckouts();

}


/* DASHBOARD */

function updateDashboard() {

  const totalCopies =
    books.reduce(

      (sum, book) =>

        sum +
        Number(
          book["Copies"] || 1
        ),

      0

    );


  const checkedOutCopies =
    checkouts.length;


  document.getElementById(
    "totalBooks"
  ).textContent =
    totalCopies;


  document.getElementById(
    "totalStudents"
  ).textContent =
    students.length;


  document.getElementById(
    "checkedOut"
  ).textContent =
    checkedOutCopies;


  document.getElementById(
    "available"
  ).textContent =
    Math.max(
      0,
      totalCopies -
      checkedOutCopies
    );

}


/* CLASS DROPDOWN */

function populateClassSelect() {

  const select =
    document.getElementById(
      "classSelect"
    );


  select.innerHTML =
    `
      <option value="">
        Select a class
      </option>
    `;


  classes.forEach(cls => {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      cls.id;


    option.textContent =
      cls.name ||
      cls.Name ||
      cls.class_name ||
      cls["Class Name"] ||
      cls.id;


    select.appendChild(
      option
    );

  });

}


/* STUDENT DROPDOWN */

function loadStudentOptions() {

  const classId =
    document.getElementById(
      "classSelect"
    ).value;


  const studentSelect =
    document.getElementById(
      "studentSelect"
    );


  studentSelect.innerHTML =
    `
      <option value="">
        Select a student
      </option>
    `;


  if (!classId) {

    return;

  }


  const classStudents =
    students.filter(

      student =>

        String(
          student.class_id
        ) ===
        String(classId)

    );


  classStudents.forEach(
    student => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        student.id;


      option.textContent =
        `#${student.student_number}`;


      studentSelect.appendChild(
        option
      );

    }
  );

}


/* AVAILABLE BOOKS */

function populateBookSelect() {

  const select =
    document.getElementById(
      "bookSelect"
    );


  select.innerHTML =
    `
      <option value="">
        Select a book
      </option>
    `;


  books.forEach(book => {

    const copies =
      Number(
        book["Copies"] || 1
      );


    const checkedOutCount =
      checkouts.filter(

        checkout =>

          String(
            checkout.book_id
          ) ===
          String(book.id)

      ).length;


    const available =
      copies -
      checkedOutCount;


    if (available > 0) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        book.id;


      let label =
        book["Title"] || "";


      if (book["Series"]) {

        label +=
          ` — ${book["Series"]}`;

      }


      option.textContent =
        label;


      select.appendChild(
        option
      );

    }

  });

}


/* CHECK OUT */

async function checkoutBook() {

  const studentId =
    document.getElementById(
      "studentSelect"
    ).value;


  const bookId =
    document.getElementById(
      "bookSelect"
    ).value;


  const message =
    document.getElementById(
      "checkoutMessage"
    );


  message.style.display =
    "none";


  if (!studentId || !bookId) {

    showMessage(

      message,

      "Please select a student and a book.",

      false

    );

    return;

  }


  const button =
    document.getElementById(
      "checkoutButton"
    );


  button.disabled =
    true;


  button.textContent =
    "Checking Out...";


  /*
    Use a date-only value.
    This prevents the browser from
    shifting the date because of UTC.
  */

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const today =
    `${year}-${month}-${day}`;


  const { error } =
    await supabaseClient
      .from("Checkouts")
      .insert({

        "Check Out Date":
          today,

        "Return Date":
          null,

        student_id:
          studentId,

        book_id:
          bookId

      });


  button.disabled =
    false;


  button.textContent =
    "Check Out Book";


  if (error) {

    console.error(
      "Checkout error:",
      error
    );


    showMessage(

      message,

      "There was a problem checking out the book.",

      false

    );


    return;

  }


  showMessage(

    message,

    "Book checked out successfully!",

    true

  );


  document.getElementById(
    "studentSelect"
  ).value = "";


  document.getElementById(
    "bookSelect"
  ).value = "";


  await loadData();

}


/* FORMAT DATE */

function formatDate(value) {

  if (!value) {

    return "";

  }


  /*
    If Supabase gives us a timestamp,
    take only the YYYY-MM-DD portion.
    This prevents UTC from changing
    the displayed day.
  */

  const datePart =
    String(value)
      .substring(
        0,
        10
      );


  const parts =
    datePart.split("-");


  if (parts.length !== 3) {

    return value;

  }


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]);


  const day =
    Number(parts[2]);


  const date =
    new Date(
      year,
      month - 1,
      day
    );


  return date.toLocaleDateString(
    "en-US",
    {
      month: "long",
      day: "numeric",
      year: "numeric"
    }
  );

}


/* RETURN BOOK */

async function returnBook(
  checkoutId
) {

  if (
    !confirm(
      "Are you sure you want to return this book?"
    )
  ) {

    return;

  }


  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const today =
    `${year}-${month}-${day}`;


  const { error } =
    await supabaseClient
      .from("Checkouts")
      .update({

        "Return Date":
          today

      })
      .eq(
        "id",
        checkoutId
      );


  if (error) {

    console.error(
      "Return error:",
      error
    );


    alert(
      "There was a problem returning the book."
    );


    return;

  }


  await loadData();

}


/* MESSAGE */

function showMessage(
  element,
  text,
  success
) {

  element.textContent =
    text;


  element.className =
    "message " +
    (
      success
        ? "success"
        : "error"
    );


  element.style.display =
    "block";

}


/* LIBRARY */

function displayBooks() {

  const container =
    document.getElementById(
      "bookList"
    );


  const search =
    document.getElementById(
      "bookSearch"
    ).value.toLowerCase();


  const filtered =
    books.filter(book => {

      const title =
        String(
          book["Title"] || ""
        ).toLowerCase();


      const author =
        String(
          book["Author"] || ""
        ).toLowerCase();


      const series =
        String(
          book["Series"] || ""
        ).toLowerCase();


      return (

        title.includes(
          search
        ) ||

        author.includes(
          search
        ) ||

        series.includes(
          search
        )

      );

    });


  if (!filtered.length) {

    container.innerHTML =
      "<p>No books found.</p>";

    return;

  }


  container.innerHTML =
    filtered.map(
      book => {

        const copies =
          Number(
            book["Copies"] || 1
          );


        const checkedOutCount =
          checkouts.filter(

            checkout =>

              String(
                checkout.book_id
              ) ===
              String(book.id)

          ).length;


        const available =
          Math.max(

            0,

            copies -
            checkedOutCount

          );


        return `

          <div class="book">

            <h3>
              ${escapeHtml(
                book["Title"] || ""
              )}
            </h3>

            <p>
              <strong>Author:</strong>
              ${escapeHtml(
                book["Author"] || ""
              )}
            </p>

            ${
              book["Series"]

                ? `

                  <p>
                    <strong>Series:</strong>
                    ${escapeHtml(
                      book["Series"]
                    )}
                  </p>

                `

                : ""
            }

            ${
              book["Series #"]

                ? `

                  <p>
                    <strong>Book #:</strong>
                    ${book["Series #"]}
                  </p>

                `

                : ""
            }

            <span
              class="badge ${
                available > 0
                  ? "available"
                  : "checked"
              }">

              ${
                available
              } of ${
                copies
              } available

            </span>

          </div>

        `;

      }
    ).join("");

}


/* STUDENTS */

function displayStudents() {

  const container =
    document.getElementById(
      "studentList"
    );


  if (!students.length) {

    container.innerHTML =
      "<p>No students found.</p>";

    return;

  }


  container.innerHTML =
    students.map(
      student => {

        const className =
          classes.find(

            c =>

              String(c.id) ===
              String(
                student.class_id
              )

          );


        const classText =
          className

            ? className.name ||
              className.Name ||
              className.class_name ||
              className["Class Name"] ||
              className.id

            : "";


        return `

          <div class="student-card">

            <strong>
              ${escapeHtml(
                String(classText)
              )}
            </strong>

            <br>

            Student #${
              student.student_number
            }

          </div>

        `;

      }
    ).join("");

}


/* CHECKED OUT */

function displayCheckouts() {

  const container =
    document.getElementById(
      "checkoutList"
    );


  if (!checkouts.length) {

    container.innerHTML =
      "<p>Nothing is currently checked out.</p>";

    return;

  }


  container.innerHTML =
    checkouts.map(
      checkout => {

        const book =
          books.find(

            b =>

              String(b.id) ===
              String(
                checkout.book_id
              )

          );


        const student =
          students.find(

            s =>

              String(s.id) ===
              String(
                checkout.student_id
              )

          );


        const className =
          student

            ? classes.find(

                c =>

                  String(c.id) ===
                  String(
                    student.class_id
                  )

              )

            : null;


        const classText =
          className

            ? className.name ||
              className.Name ||
              className.class_name ||
              className["Class Name"] ||
              className.id

            : "";


        return `

          <div class="checkout-item">

            <div class="checkout-info">

              <h3>

                ${escapeHtml(

                  book

                    ? book["Title"]

                    : "Unknown Book"

                )}

              </h3>


              <p>

                <strong>Student:</strong>

                ${escapeHtml(
                  String(
                    classText
                  )
                )}

                #${
                  student
                    ? student.student_number
                    : "?"
                }

              </p>


              <p>

                <strong>Checked out:</strong>

                ${formatDate(
                  checkout[
                    "Check Out Date"
                  ]
                )}

              </p>

            </div>


            <button
              class="return-button"
              onclick="returnBook('${
                checkout.id
              }')">

              ↩️ Return

            </button>

          </div>

        `;

      }
    ).join("");

}


/* NAVIGATION */

function showPage(
  pageId,
  button
) {

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      page => {

        page.classList.remove(
          "active"
        );

      }
    );


  document
    .getElementById(
      pageId
    )
    .classList.add(
      "active"
    );


  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      btn => {

        btn.classList.remove(
          "active"
        );

      }
    );


  button.classList.add(
    "active"
  );

}


/* ESCAPE HTML */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
